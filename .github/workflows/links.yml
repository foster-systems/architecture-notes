name: Links
on:
  push:
    branches: [main]
    paths: ['notes/**', 'scripts/links.mjs']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run links | tee report.md
        shell: bash
      - if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --search 'in:title "Broken links"' --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file report.md
          else gh issue create --title "Broken links" --body-file report.md; fi
